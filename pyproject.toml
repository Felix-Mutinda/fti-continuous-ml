[project]
name = "fti-continuous-ml"
version = "0.1.0"
description = "Continuous Model Training using FTI framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dbt-postgres>=1.11.0",
    "feast[redis]>=0.65.0",
    "mlflow>=3.15.0",
    "pandas>=2.3.3",
    "polars>=1.43.2",
    "psycopg2-binary>=2.9.12",
    "pyarrow>=25.0.0",
    "pytest>=9.1.1",
    "redis>=7.4.1",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
    "sqlalchemy>=2.0.51",
    "xgboost>=3.2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.1",
]
